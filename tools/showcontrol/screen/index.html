<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Show Control Screen</title>
<!-- The visualizer on the Mac's own screen (Screen.swift feeds it). Drawn at 240 or 448 lines,
     vertices snapped to the pixel grid, textures mapped affine, colour dithered to 5 or 6 bits. -->
<style>
@font-face { font-family: "Exo 2"; src: url("../Fonts/Exo2.0-SemiBold.otf"); }
@font-face { font-family: "Sora"; src: url("../Fonts/Sora-Light.ttf"); font-weight: 300; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
body.idle { cursor: none; }
.tag { position: fixed; left: 28px; color: rgba(255, 255, 255, 0.72); pointer-events: none; transition: opacity 0.8s; }
#name { top: 22px; font: 600 15px "Exo 2", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
#help { bottom: 22px; font: 300 12.5px "Sora", sans-serif; }
#meter { top: 22px; left: auto; right: 28px; font: 300 12.5px "Sora", sans-serif; opacity: 0; }
</style>
</head>
<body>
<div class="tag" id="name"></div>
<div class="tag" id="meter"></div>
<div class="tag" id="help">1–9 scenes · 0 auto · drag to look · click to hit · scroll for speed · space flash · P 240p / 480p / native · T title · F frame rate · H help · Esc close</div>
<script src="three.min.js"></script>
<script>
"use strict";
THREE.ColorManagement.enabled = false;
const post = (m) => { try { window.webkit.messageHandlers.screen.postMessage(m); } catch (e) {} };
const WHITE = new THREE.Color(1, 1, 1);
const rand = (a, b) => a + Math.random() * (b - a);

// The music, as Show Control hears it (already held back to land with the speakers).
const S = { level: 0, energy: 0, target: new Float32Array(16), bands: new Float32Array(16), wave: new Float32Array(64), waveTarget: new Float32Array(64),
  bass: 0, mid: 0, high: 0, kick: 0, impact: 0, note: 0, swell: 0, held: false, key: false, speed: 1 };
let palette = [], paletteVersion = 0;
const pal = (i) => palette[((i % palette.length) + palette.length) % palette.length];
function setPalette(cs) {
  palette = cs.slice(0, 5).map(([r, g, b]) => new THREE.Color(r / 255, g / 255, b / 255));
  const fill = [[255, 0, 255], [148, 171, 249], [106, 34, 192]];
  while (palette.length < 3) palette.push(new THREE.Color(...fill[palette.length].map((v) => v / 255)));
  paletteVersion++;
}
setPalette([]);

window.feed = (level, beat, bands, wave) => {
  S.level = level / 255;
  for (let i = 0; i < 16; i++) S.target[i] = (bands[i] || 0) / 255;
  for (let i = 0; i < 64; i++) S.waveTarget[i] = (wave[i] || 0) / 128;
};
window.kick = (s) => { S.kick = Math.max(S.kick, 0.55 + 0.45 * s); scene().kick?.(s); director.kick(); };
window.accent = (s) => scene().accent?.(s);
// A bass note: the whole picture swells with it and fades as the bass does, never a hit.
window.swell = (s) => { S.note = Math.max(S.note, 0.5 + 0.5 * s); };
window.impact = () => { S.impact = 1; scene().impact?.(); director.impact(); };
window.flash = (on) => { S.held = on; };
window.hit = (x, y) => { S.kick = Math.max(S.kick, 0.8); scene().click?.(x, y); };
window.song = (title, artist, colours) => {
  if (colours && colours.length) setPalette(colours);
  caption.show(title, artist);
  if (settings.scene === "auto" && title) { autoAt = 0; step(1); }
};
const settings = { scene: "auto", res: 240, caption: true };
window.configure = (s) => {
  const res = settings.res;
  Object.assign(settings, s);
  if (settings.res !== res) applyRes();
  if (settings.scene !== "auto") use(settings.scene);
  if (!settings.caption) caption.hide();
};

// Low-res target, then a pass up to the screen: nearest pixels, ordered dither, PS2 softness.
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(devicePixelRatio || 1);
document.body.appendChild(renderer.domElement);
const low = new THREE.Vector2(320, 240);
let rt = null;

const postMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: null }, res: { value: low }, flash: { value: 0 }, swell: { value: 0 }, fade: { value: 0 }, levels: { value: 31 }, soft: { value: 0 }, dither: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `
    uniform sampler2D t; uniform vec2 res; uniform float flash, swell, fade, levels, soft, dither; varying vec2 vUv;
    float b2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
    float b4(vec2 a) { return b2(0.5 * a) * 0.25 + b2(a); }
    vec3 at(vec2 p) { return texture2D(t, (p + 0.5) / res).rgb; }
    void main() {
      vec2 p = floor(vUv * res);
      vec3 c = at(p);
      if (soft > 1.5) {  // native: a glow round the bright parts
        vec3 g = vec3(0.);
        for (int i = 0; i < 12; i++) {
          float a = float(i) * 0.5236, r = (mod(float(i), 2.) < 0.5 ? 1. : 2.3) * res.y / 200.;
          g += max(at(p + vec2(cos(a), sin(a)) * r) - 0.5, 0.);
        }
        c += g * 0.11;
      } else if (soft > 0.5) {
        vec3 n = at(p + vec2(1., 0.)) + at(p - vec2(1., 0.)) + at(p + vec2(0., 1.)) + at(p - vec2(0., 1.));
        c = c * 0.7 + n * 0.075 + max(n * 0.25 - 0.55, 0.) * 0.5;
        c *= 0.94 + 0.06 * mod(p.y, 2.);
      }
      c *= 1. + swell * 0.45;  // a bass note: brighter all over, the bright parts most
      c = mix(c * fade, vec3(1.), flash);
      c = floor(c * levels + mix(0.5, b4(p), dither)) / levels;
      gl_FragColor = vec4(c, 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene(), flat = new THREE.Camera();
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
postQuad.frustumCulled = false;
postScene.add(postQuad);

// The PS1 material: vertices snapped to the low-res grid, affine texture mapping (uv times w,
// divided back per pixel), one light, fog.
const shared = { snap: { value: new THREE.Vector2(160, 120) }, affine: { value: 1 }, fogColor: { value: new THREE.Color() },
  fogNear: { value: 20 }, fogFar: { value: 80 } };
const VERT = `
  uniform vec2 snap; uniform float fogNear, fogFar;
  varying vec2 vUvW, vUv; varying float vW, vFog, vLight; varying vec3 vCol;
  void main() {
    vUv = uv;
    vec4 local = vec4(position, 1.);
    vec3 nn = normal;
    #ifdef USE_INSTANCING
    local = instanceMatrix * local;
    nn = mat3(instanceMatrix) * nn;
    #endif
    vec4 mv = modelViewMatrix * local;
    vec4 p = projectionMatrix * mv;
    p.xy = floor(p.xy / p.w * snap + 0.5) / snap * p.w;
    gl_Position = p;
    vUvW = uv * p.w; vW = p.w;
    vFog = clamp((-mv.z - fogNear) / (fogFar - fogNear), 0., 1.);
    vLight = 0.3 + 0.7 * max(dot(normalize(normalMatrix * nn), normalize(vec3(0.4, 0.9, 0.6))), 0.);
    vCol = vec3(1.);
    #ifdef USE_COLOR
    vCol = color;
    #endif
    #ifdef USE_INSTANCING_COLOR
    vCol *= instanceColor;
    #endif
  }`;
const FRAG = `
  uniform vec3 tint, fogColor; uniform sampler2D map; uniform float useMap, glow, opacity, fogMix, affine; uniform vec2 repeat, offset;
  varying vec2 vUvW, vUv; varying float vW, vFog, vLight; varying vec3 vCol;
  void main() {
    vec3 c = tint * vCol;
    if (useMap > 0.5) c *= texture2D(map, (affine > 0.5 ? vUvW / vW : vUv) * repeat + offset).rgb;
    c *= mix(vLight, 1., glow);
    c = mix(c, fogColor, vFog * fogMix);
    gl_FragColor = vec4(c, opacity);
  }`;
function psx(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: { ...shared, tint: { value: (o.tint || WHITE).clone() }, map: { value: o.map || null }, useMap: { value: o.map ? 1 : 0 },
      repeat: { value: o.repeat || new THREE.Vector2(1, 1) }, offset: { value: new THREE.Vector2() },
      glow: { value: o.glow ?? 0 }, opacity: { value: o.opacity ?? 1 }, fogMix: { value: o.fog ?? 1 } },
    vertexShader: VERT, fragmentShader: FRAG, wireframe: !!o.wire, vertexColors: !!o.colors, side: o.side ?? THREE.FrontSide,
    transparent: !!o.add || (o.opacity ?? 1) < 1, blending: o.add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !o.add,
    polygonOffset: !!o.under, polygonOffsetFactor: 2, polygonOffsetUnits: 2,  // under: lines drawn over it stay whole
  });
}
const tint = (mesh) => mesh.material.uniforms.tint.value;

// The pointer: where it is (smoothed), how far it has dragged, the wheel's warp.
const input = { x: 0, y: 0, tx: 0, ty: 0, dragX: 0, dragY: 0, warp: 1 };
// The director: a scene's shots are functions of the time and the time into the shot, giving
// numbers (a camera's position, what it looks at and its roll, or a shader's own camera). Every
// 16-24 kicks it moves to another, gliding or cutting on the beat; an impact cuts at once.
const director = {
  shot: 0, from: null, last: null, b: 1, u: 0, kicks: 0, blend: 3, quiet: 0, count: 0,
  reset(n) { this.count = n; this.shot = Math.floor(Math.random() * Math.max(1, n)); this.from = null; this.b = 1; this.u = 0; this.kicks = 0; },
  next(cut) {
    if (this.count < 2) return;
    let k;
    do k = Math.floor(Math.random() * this.count); while (k === this.shot);
    this.from = cut || !this.last ? null : this.last.slice();
    this.shot = k; this.u = 0; this.b = this.from ? 0 : 1;
    this.blend = rand(2.5, 4.5);
  },
  kick() { this.quiet = 0; if (++this.kicks >= (S.energy > 0.5 ? 16 : 24)) { this.kicks = 0; this.next(Math.random() < 0.5); } },
  impact() { this.kicks = 0; this.next(true); },
  frame(shots, t, dt) {
    this.u += dt;
    if ((this.quiet += dt) > 20) { this.quiet = 0; this.next(false); }
    this.b = Math.min(1, this.b + dt / this.blend);
    const cur = shots[this.shot % shots.length](t, this.u), e = this.b * this.b * (3 - 2 * this.b);
    this.last = this.from ? cur.map((v, i) => this.from[i] + (v - this.from[i]) * e) : cur;
    return this.last;
  },
};
// A shot onto a camera: [x, y, z, look x, y, z, roll]; a drag turns it round what it looks at.
function aim(camera, v) {
  const dx = v[0] - v[3], dz = v[2] - v[5], c = Math.cos(input.dragX), s = Math.sin(input.dragX);
  camera.position.set(v[3] + dx * c - dz * s, v[1] + input.dragY * 12, v[5] + dx * s + dz * c);
  camera.lookAt(v[3] + input.x * 8, v[4] - input.y * 5, v[5]);
  if (v[6]) camera.rotateZ(v[6]);
}
const FLATV = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;
// A palette ramp for the shader scenes: dark, c0, c1, c2, dark again.
const RAMP = `
  vec3 ramp(float s) {
    s = fract(s) * 4.;
    if (s < 1.) return mix(c2 * 0.15, c0, s);
    if (s < 2.) return mix(c0, c1, s - 1.);
    if (s < 3.) return mix(c1, c2, s - 2.);
    return mix(c2, c2 * 0.15, s - 3.);
  }`;

// MARK: Polygon Sea: a flat-shaded sea heaving with the bass, the spectrum rolling across it,
// rings spreading from kicks and clicks.
function makeSea() {
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(62, 1, 0.1, 300);
  const size = 110, wide = 240, base = new THREE.PlaneGeometry(wide, size, 72, 40);  // wide enough for 21:9
  base.rotateX(-Math.PI / 2);
  const geo = base.toNonIndexed(), pos = geo.attributes.position, rest = pos.array.slice();
  const land = new THREE.Mesh(geo, psx({ under: true })), wire = new THREE.Mesh(geo, psx({ wire: true, glow: 1, add: true, opacity: 0.75 }));
  const sun = new THREE.Mesh(new THREE.IcosahedronGeometry(9, 0), psx({ glow: 1, fog: 0 }));
  sun.position.set(0, 16, -90);
  scene.add(land, wire, sun);
  scene.background = shared.fogColor.value;
  const ripples = [], plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ray = new THREE.Raycaster(), hit = new THREE.Vector3();
  let travel = 0;
  const ripple = (x, z, amp) => { ripples.push({ x, z, age: 0, amp }); if (ripples.length > 10) ripples.shift(); };
  return {
    scene, camera,
    update(dt, t) {
      travel += dt * (2 + S.energy * 7) * S.speed;
      for (const r of ripples) r.age += dt;
      while (ripples.length && ripples[0].age > 5) ripples.shift();
      const a = pos.array, amp = 0.35 + S.bass * 1.8;
      for (let i = 0; i < a.length; i += 3) {
        const x = rest[i], z = rest[i + 2], zt = z - travel;
        let h = (Math.sin(x * 0.21 + t * 0.9) * 0.7 + Math.cos(zt * 0.17 + t * 0.6) * 0.9 + Math.sin((x + zt) * 0.1) * 0.9) * amp;
        h += S.bands[Math.max(0, Math.min(15, Math.floor((x / 120 + 0.5) * 16)))] * 3.2 * (z / size + 0.5);
        for (const r of ripples) {
          const d = Math.hypot(x - r.x, z - r.z) - r.age * 16;
          h += r.amp * Math.exp(-r.age * 0.8) * Math.exp(-d * d * 0.03) * Math.cos(d * 0.7);
        }
        a[i + 1] = h;
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();
      tint(land).copy(pal(0)).multiplyScalar(0.7 + S.kick * 0.4);
      tint(wire).copy(pal(1)).lerp(WHITE, S.kick * 0.5);
      tint(sun).copy(pal(0)).lerp(WHITE, 0.25 + S.level * 0.35);
      sun.scale.setScalar(1 + S.kick * 0.3 + S.bass * 0.4);
      sun.rotation.y += dt * 0.25;
      sun.rotation.x += dt * 0.15;
      shared.fogColor.value.copy(pal(2)).multiplyScalar(0.1);
      shared.fogNear.value = 18; shared.fogFar.value = 85;
    },
    shots: [
      (t) => [Math.sin(t * 0.07) * 6, 11, 44, 0, 2, -20],                                              // the glide
      (t) => [Math.sin(t * 0.2) * 12, 3.4 + S.bass * 1.5, 30, Math.sin(t * 0.2 + 0.5) * 16, 4, -40, Math.sin(t * 0.3) * 0.08],  // skimming
      (t, u) => [0, 36 + Math.sin(u * 0.2) * 4, Math.max(-10, 32 - u * 0.9), 0, 0, -14],                // the crane
      (t) => [Math.sin(t * 0.08) * 50, 14, Math.cos(t * 0.08) * 50, 0, 1, 0],                          // round the sea
      (t, u) => [0, 6, 52 - Math.min(u, 35), 0, 13, -90],                                               // into the sun
      (t, u) => [-70 + (u * 3.5) % 140, 7, 12, -50 + (u * 3.5) % 140, 3, -25],                         // tracking
    ],
    kick(s) { ripple(rand(-70, 70), rand(-35, 25), 1.2 + s); },
    impact() { ripple(0, 10, 7); },
    click(nx, ny) {
      ray.setFromCamera({ x: nx, y: ny }, camera);
      if (ray.ray.intersectPlane(plane, hit)) ripple(hit.x, hit.z, 5);
    },
  };
}

// MARK: Signal Towers: the spectrum as a city of blocks, each row a moment further back.
function makeTowers() {
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(58, 1, 0.1, 300);
  const cols = 16, rows = 30, gap = 1.7;
  const box = new THREE.BoxGeometry(1.15, 1, 1.15).toNonIndexed();
  box.translate(0, 0.5, 0);
  const mesh = new THREE.InstancedMesh(box, psx(), cols * rows);
  const c = new THREE.Color(), m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), k = new THREE.Vector3();
  for (let i = 0; i < cols * rows; i++) mesh.setColorAt(i, c.set(1, 1, 1));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(cols * gap + 20, rows * gap + 20, cols + 10, rows + 10).rotateX(-Math.PI / 2),
    psx({ wire: true, glow: 1, add: true, opacity: 0.35 }));
  floor.position.set(0, -0.02, -rows * gap / 2 + gap);
  scene.add(mesh, floor);
  scene.background = shared.fogColor.value;
  const hist = Array.from({ length: rows }, () => new Float32Array(cols));
  let shift = 0, spin = 0.5, boost = 0;
  return {
    scene, camera,
    update(dt, t) {
      shift += dt;
      if (shift > 1 / 12) { shift = 0; hist.pop(); hist.unshift(new Float32Array(cols)); }
      hist[0].set(S.bands);
      boost *= Math.exp(-dt * 2.5);
      for (let r = 0; r < rows; r++) for (let i = 0; i < cols; i++) {
        const n = r * cols + i, h = 0.12 + hist[r][i] * 10 + boost * (6 + Math.sin(i * 0.9 + r * 0.6) * 4) * Math.max(0, 1 - r / 12);
        m.compose(v.set((i - cols / 2 + 0.5) * gap, 0, -r * gap), q, k.set(1, h, 1));
        mesh.setMatrixAt(n, m);
        const u = i / (cols - 1) * 2;
        c.copy(pal(Math.floor(u))).lerp(pal(Math.floor(u) + 1), u % 1);
        if (r === 0) c.lerp(WHITE, S.kick * 0.7);
        mesh.setColorAt(n, c);
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.needsUpdate = true;
      tint(floor).copy(pal(1)).multiplyScalar(0.5 + S.kick * 0.5);
      spin += dt * (0.06 + S.energy * 0.14) * S.speed;
      shared.fogColor.value.copy(pal(2)).multiplyScalar(0.07);
      shared.fogNear.value = 25; shared.fogFar.value = 75;
    },
    shots: [
      () => [Math.sin(spin) * 30, 13 + S.bass * 3, -16 + Math.cos(spin) * 30, 0, 2, -16],              // round the city
      (t, u) => [0, 1.6, 14 - (u * 5) % 75, 0, 2.2, 2 - (u * 5) % 75],                                  // down the street
      () => [Math.sin(spin * 0.7) * 6, 46, -16 + Math.cos(spin * 0.7) * 6, 0, 0, -16],                  // from above
      (t) => [Math.sin(t * 0.15) * 14, 3, 14, 0, 5, -10],                                              // the front row
      (t) => [-42 + Math.sin(t * 0.05) * 6, 26, 22, 0, 0, -22],                                         // wide
    ],
    impact() { boost = 1.4; },
    click() { boost = 1; },
  };
}

// MARK: Tunnel: a twelve-sided tunnel with a swimming checker texture, rings flying out of the
// dark on the kicks.
function makeTunnel() {
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(78, 1, 0.1, 300);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 64;
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.generateMipmaps = false;
  let painted = -1;
  function paint() {
    const g = canvas.getContext("2d"), img = g.createImageData(64, 64), a = pal(0), b = pal(1).clone().multiplyScalar(0.3), s = pal(2);
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      let col = ((x >> 3) + (y >> 3)) % 2 ? a : b;
      if ((x + y) % 16 < 2) col = s;
      const d = ((x * 7 + y * 13) % 5) / 40, o = (y * 64 + x) * 4;
      img.data[o] = Math.min(255, (col.r + d) * 255); img.data[o + 1] = Math.min(255, (col.g + d) * 255);
      img.data[o + 2] = Math.min(255, (col.b + d) * 255); img.data[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    tex.needsUpdate = true;
    painted = paletteVersion;
  }
  const tubeGeo = new THREE.CylinderGeometry(6, 6, 220, 12, 44, true);
  tubeGeo.rotateX(Math.PI / 2);
  const tube = new THREE.Mesh(tubeGeo, psx({ map: tex, repeat: new THREE.Vector2(3, 26), side: THREE.BackSide }));
  scene.add(tube);
  scene.background = shared.fogColor.value;
  const ringGeo = new THREE.TorusGeometry(4.6, 0.28, 4, 12), rings = [];
  for (let i = 0; i < 18; i++) {
    const r = new THREE.Mesh(ringGeo, psx({ glow: 1, add: true }));
    r.visible = false;
    rings.push(r);
    scene.add(r);
  }
  let n = 0, speed = 1;
  const spawn = (z = -95) => { const r = rings[n++ % rings.length]; r.visible = true; r.position.set(0, 0, z); r.userData.c = n; };
  return {
    scene, camera,
    update(dt, t) {
      if (painted !== paletteVersion) paint();
      speed = (1.4 + S.energy * 5 + S.kick * 2.5) * S.speed;
      const u = tube.material.uniforms;
      u.offset.value.y += dt * speed * 0.12;
      u.offset.value.x += dt * (0.015 + S.mid * 0.08);
      tint(tube).setScalar(0.55 + S.level * 0.5 + S.kick * 0.3);
      tube.rotation.z = Math.sin(t * 0.21) * 0.6;
      for (const r of rings) {
        if (!r.visible) continue;
        r.position.z += dt * speed * 14;
        r.rotation.z += dt * 0.8;
        tint(r).copy(pal(r.userData.c)).lerp(WHITE, S.kick * 0.4);
        if (r.position.z > 4) r.visible = false;
      }
      shared.fogColor.value.set(0, 0, 0);
      shared.fogNear.value = 6; shared.fogFar.value = 78;
    },
    shots: [
      (t) => [Math.sin(t * 0.5) * 1.6 * (0.4 + S.bass), Math.cos(t * 0.37) * 1.2, 0, 0, 0, -30, Math.sin(t * 0.17) * 0.25],
      (t) => [Math.cos(t * 0.3) * 3.4, Math.sin(t * 0.3) * 3.4, 0, 0, 0, -30, (t * 0.3) % 6.283],     // along the wall
      (t) => [0, 0, 0, Math.sin(t * 0.4) * 2, Math.cos(t * 0.3) * 2, -30, (t * 0.9) % 6.283],         // spinning
      (t) => [Math.sin(t * 1.3) * 2, Math.sin(t * 0.9) * 2, 0, Math.sin(t * 1.3 + 1) * 4, Math.sin(t * 0.9 + 1) * 4, -30, Math.sin(t * 0.6) * 0.6],
    ],
    aim(v) {  // stays in the tube: the pointer and a drag turn the head, not the camera
      camera.position.set(v[0], v[1], v[2]);

// MARK: Crystal: a faceted crystal swelling with the spectrum, shards orbiting it that scatter on

          const c = pal(f % 3).clone().lerp(pal(f % 3 + 1), (f * 0.37) % 1);
          for (let j = 0; j < 3; j++) col.setXYZ(f * 3 + j, c.r, c.g, c.b);

      }

        v.set(Math.cos(ang) * r, Math.sin(ang * 2 + i) * 2 + o.tilt * r, Math.sin(ang) * r);

      (t) => [30 + Math.sin(t * 0.05) * 5, 26, 40, 0, -2, 0],                                          // wide

      (t) => [Math.sin(t * 0.1) * 3, 40, Math.cos(t * 0.1) * 3, 0, 0, 0],                             // from above

}

// MARK: Dither Field: metaballs and plasma in contour bands through the palette, the waveform
// drawn across; a click drops a blob where it lands.
function makeField() {
  const scene = new THREE.Scene();
  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, aspect: { value: 1.33 }, bands: { value: new Float32Array(16) }, wave: { value: new Float32Array(64) },
      level: { value: 0 }, kick: { value: 0 }, c0: { value: new THREE.Color() }, c1: { value: new THREE.Color() }, c2: { value: new THREE.Color() },
      zoom: { value: 1 }, turn: { value: 0 },
      blobs: { value: Array.from({ length: 6 }, () => new THREE.Vector3(0, 0, 99)) } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
    fragmentShader: `
      uniform float time, aspect, level, kick, zoom, turn; uniform float bands[16]; uniform float wave[64];
      uniform vec3 c0, c1, c2; uniform vec3 blobs[6]; varying vec2 vUv;
      ${RAMP}
      void main() {
        vec2 uv = vUv * 2. - 1.;
        uv.x *= aspect;
        uv *= (1. - kick * 0.08) * zoom;
        uv = mat2(cos(turn), -sin(turn), sin(turn), cos(turn)) * uv;
        float v = 0.;
        for (int i = 0; i < 5; i++) {
          float f = float(i);
          vec2 c = vec2(sin(time * (0.3 + f * 0.07) + f * 1.7) * aspect * 0.75, cos(time * (0.25 + f * 0.05) + f * 2.3) * 0.7);
          float r = 0.16 + bands[i * 3] * 0.4;

        }
        for (int i = 0; i < 6; i++) {
          float age = blobs[i].z;
          if (age < 4.) { vec2 d = uv - blobs[i].xy; float r = 0.5 * exp(-age * 0.6); v += r * r / max(dot(d, d), 0.0004); }
        }
        v += 0.3 * sin(uv.x * 3. + time) * cos(uv.y * 2.6 - time * 0.7);
        vec3 col = ramp(min(v, 3.2) * 0.45 + time * 0.04) * (v > 1. ? 1. : 0.25 + 0.6 * v);
        int k = int(clamp(vUv.x * 63., 0., 63.));
        float w = wave[k] * (0.35 + level * 0.5);
        col += c1 * smoothstep(0.035, 0., abs(vUv.y * 2. - 1. - w)) * 1.3;
        gl_FragColor = vec4(col * (1. + kick * 0.35), 1.);
      }`,
    depthTest: false, depthWrite: false,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  quad.frustumCulled = false;
  scene.add(quad);
  let n = 0;
  return {
    scene, camera: flat,
    resize(aspect) { mat.uniforms.aspect.value = aspect; },
    update(dt, t) {
      const u = mat.uniforms;
      u.time.value += dt * (0.6 + S.energy * 1.6) * S.speed;
      u.bands.value.set(S.bands);
      u.wave.value.set(S.wave);
      u.level.value = S.energy;
      u.kick.value = S.kick;
      u.c0.value.copy(pal(0)); u.c1.value.copy(pal(1)); u.c2.value.copy(pal(2));
      for (const b of u.blobs.value) b.z += dt;
    },
    shots: [() => [1, 0], (t) => [0.6, t * 0.05], (t) => [1.5, -t * 0.03], (t) => [0.8 + Math.sin(t * 0.2) * 0.3, Math.sin(t * 0.1) * 0.6]],
    aim(v) { mat.uniforms.zoom.value = v[0]; mat.uniforms.turn.value = v[1]; },
    click(nx, ny) { mat.uniforms.blobs.value[n++ % 6].set(nx * mat.uniforms.aspect.value, ny, 0); },
    impact() { mat.uniforms.blobs.value[n++ % 6].set(0, 0, 0); },
  };
}

// MARK: Light Grid: an LED wall of square tiles split by a hairline of black (fine, or a few huge
// ones), seen from its foot: it leans back from the bottom of the screen and fades into the dark
// at the top. Light-show patterns, a new one every 16 kicks: spectrum bars, rings, rain, scanning
// beams, a strobing checker, life stepping on the beat, wipes, sparkle, pulses from the middle.
const LEAN = 0.62, LENS = 0.42;  // the wall's lean back (radians) and the view's half-height slope

    uniforms: { cells: { value: null }, grid: { value: new THREE.Vector2(1, 1) }, gap: { value: 1 },
      aspect: { value: 1.33 }, origin: { value: new THREE.Vector2() }, scale: { value: 1 } },
    vertexShader: FLATV,

      uniform sampler2D cells; uniform vec2 grid, origin; uniform float gap, aspect, scale; varying vec2 vUv;

        float t = -cp / (dy * sp - cp);

        vec2 c = floor(g), f = fract(g), w = fwidth(g), gw = w * gap;
        vec2 m = smoothstep(gw, gw + w, f);  // the black hairline, a pixel or two wide at any depth
        vec3 v = texture2D(cells, (c + 0.5) / grid).rgb;
        vec3 col = v * (0.8 + 0.24 * f.y);  // lit from above
        col = mix(col, vec3(1.), step(1. - gw.y * 1.5, f.y) * 0.22 * min(1., dot(v, vec3(1.))));  // a bright top edge on lit tiles
        col = (col + 0.035) * m.x * m.y;
        gl_FragColor = vec4(col * mix(1., 0.4, smoothstep(0.25, 1., vUv.y)), 1.);  // into the dark at the top

    depthTest: false, depthWrite: false,
  });

  let prog = "bars", kicks = 0, hue = 0, quiet = 0, st = {};

    // to fill the wider, farther top.
    const asp = low.x / low.y, [ub, vb] = leanHit(1, -1, asp), [ut, vt] = leanHit(1, 1, asp);
    sc = Math.round((big ? 2.6 : 7) * asp) / (2 * ub);
    cols = Math.ceil(2 * ut * sc) + 2; rows = Math.ceil((vt - vb) * sc) + 1;
    x0 = Math.floor(cols / 2 - ub * sc); x1 = Math.ceil(cols / 2 + ub * sc) - 1;
    mat.uniforms.aspect.value = asp;
    mat.uniforms.scale.value = sc;
    mat.uniforms.origin.value.set(cols / 2, -vb * sc);
    mat.uniforms.gap.value = settings.res ? 1 : Math.max(1, Math.round(low.y / 700));
    cells = new Float32Array(cols * rows * 3);
    data = new Uint8Array(cols * rows * 4).fill(255);
    tex?.dispose();
    tex = new THREE.DataTexture(data, cols, rows, THREE.RGBAFormat);
    tex.magFilter = tex.minFilter = THREE.NearestFilter;
    tex.needsUpdate = true;
    mat.uniforms.cells.value = tex;
    mat.uniforms.grid.value.set(cols, rows);

    const i = (y * cols + x) * 3;

    bars: { decay: 16, frame() {

        const h = lift(S.bands[Math.max(0, Math.min(15, Math.floor((x - x0) / (x1 - x0 + 1) * 16)))]) * rows;
        for (let y = 0; y < h; y++) put(x, y, h > 1 && y >= Math.floor(h) - 1 ? col(2).clone().lerp(WHITE, 0.55) : col(Math.floor(y / rows * 3)), 1);

    mirror: { decay: 12, frame() {

    ripple: { decay: 7, kick(s) { (st.r ||= []).push({ x: ri(cols), y: ri(rows), r: 0, c: col(st.r.length) }); },
      frame(dt) {

    rain: { decay: 6, kick() { for (let x = 0; x < cols; x += 2) (st.d ||= []).push({ x: x + ri(2), y: rows, v: rand(6, 12), c: col(ri(3)) }); },
      frame(dt) {

    scanner: { decay: 10, kick() { st.hit = 1; },
      frame(dt, t) {

        }
      } },
    checker: { decay: 5, kick() { st.p = 1 - (st.p || 0); st.n = (st.n || 0) + 1; st.f = 1; },
      frame(dt) {

      } },
    life: { decay: 9,
      kick() {

// MARK: Voxel Hills: a flight low over blocky hills, ridges rising with the spectrum, the sky in the
// palette. One raymarch per pixel over a sum of waves; native resolution draws it at half.
const hills = (x, z) => {
  x = Math.floor(x / 5) * 5; z = Math.floor(z / 5) * 5;
  return Math.floor((Math.sin(x * 0.031) * Math.cos(z * 0.027) * 22 + Math.sin(x * 0.083 + z * 0.061) * 9 + Math.cos(z * 0.12 - x * 0.04) * 4) / 3) * 3;
};
function makeVoxel() {
  const scene = new THREE.Scene();
  const mat = new THREE.ShaderMaterial({
    uniforms: { aspect: { value: 1.33 }, cam: { value: new THREE.Vector3() }, yaw: { value: 0 }, pitch: { value: 0 }, bank: { value: 0 },
      bands: { value: new Float32Array(16) }, kick: { value: 0 }, level: { value: 0 },
      c0: { value: new THREE.Color() }, c1: { value: new THREE.Color() }, c2: { value: new THREE.Color() } },
    vertexShader: FLATV,
    fragmentShader: `
      uniform float aspect, yaw, pitch, bank, kick, level; uniform vec3 cam, c0, c1, c2; uniform float bands[16]; varying vec2 vUv;
      ${RAMP}
      float H(vec2 p) {
        p = floor(p / 5.) * 5.;  // blocks, and the heights in steps: terraces
        float h = sin(p.x * 0.031) * cos(p.y * 0.027) * 22. + sin(p.x * 0.083 + p.y * 0.061) * 9. + cos(p.y * 0.12 - p.x * 0.04) * 4.;
        return floor((h + bands[int(mod(floor(p.x * 0.02 + p.y * 0.013), 16.))] * 16.) / 3.) * 3.;
      }
      void main() {
        vec2 uv = vUv * 2. - 1.;
        uv.x *= aspect;
        uv = mat2(cos(bank), -sin(bank), sin(bank), cos(bank)) * uv;
        vec3 d = normalize(vec3(uv.x, uv.y + pitch, -1.5));
        d.xz = mat2(cos(yaw), -sin(yaw), sin(yaw), cos(yaw)) * d.xz;
        vec3 horizon = mix(c0, vec3(1.), 0.12) * 0.8;
        vec3 sky = mix(horizon, c2 * 0.35, clamp(d.y * 1.3, 0., 1.));
        sky += c1 * pow(max(dot(d, normalize(vec3(sin(yaw), 0.12, -cos(yaw)))), 0.), 40.) * 1.2;
        vec3 col = sky;
        float t = 1.;
        for (int i = 0; i < 110; i++) {
          vec3 p = cam + d * t;
          float h = H(p.xz);
          if (p.y < h) {
            vec3 q = p - d * (0.6 + t * 0.025);  // the step before: hit through a side or the top
            float side = q.y >= H(q.xz) ? 0.95 : 0.55;
            vec3 g = mix(c0, c1, clamp(h / 50. + 0.5, 0., 1.)) * side * (0.85 + kick * 0.45);
            g = mix(g, c2 * 0.5, clamp(-h / 40., 0., 0.7));
            col = mix(g, horizon, pow(clamp(t / 360., 0., 1.), 1.4));
            break;
          }
          t += 0.6 + t * 0.025;
          if (t > 360.) break;
        }
        gl_FragColor = vec4(col, 1.);
      }`,
    depthTest: false, depthWrite: false,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  quad.frustumCulled = false;
  scene.add(quad);
  let x = 0, z = 0, heading = 0, ground = 0;
  return {
    scene, camera: flat, maxLines: 720,
    resize(a) { mat.uniforms.aspect.value = a; },
    update(dt, t) {
      const u = mat.uniforms;
      u.bands.value.set(S.bands);
      u.kick.value = S.kick;
      u.c0.value.copy(pal(0)); u.c1.value.copy(pal(1)); u.c2.value.copy(pal(2));
    },
    shots: [
      (t) => [26, 0.05, 0.35, Math.sin(t * 0.35) * 0.06, 1],          // cruising
      (t) => [8, 0.12, 0.6, Math.sin(t * 0.5) * 0.1, 1.7],            // skimming the tops
      (t) => [70, -0.28, 0.2, 0, 0.7],                                // high above
      (t) => [20, 0.02, 1.1, Math.sin(t * 0.4) * 0.3, 1.2],           // banking turns
    ],
    aim(v) {
      const dt = 1 / 60, u = mat.uniforms;
      heading += Math.sin(performance.now() / 1000 * 0.15) * v[2] * dt * 0.6;
      const yaw = heading + input.dragX + input.x * 0.3, sp = (14 + S.energy * 40) * S.speed * v[4];
      x += Math.sin(yaw) * sp * dt; z -= Math.cos(yaw) * sp * dt;
      let g = hills(x, z);
      for (let k = 1; k <= 3; k++) g = Math.max(g, hills(x + Math.sin(yaw) * k * 6, z - Math.cos(yaw) * k * 6));
      ground += (g - ground) * 0.08;
      u.cam.value.set(x, ground + 10 + v[0] + S.bass * 4, z);
      u.yaw.value = yaw; u.pitch.value = v[1] - input.y * 0.2 + input.dragY * 0.5; u.bank.value = v[3];
    },
    click() { S.kick = 1; },
  };
}

// MARK: Rotozoom: a tiled pattern turning and zooming, its colours cycling through the palette.
function makeRoto() {
  const scene = new THREE.Scene();
  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, aspect: { value: 1.33 }, ang: { value: 0 }, zoom: { value: 1 }, warp: { value: 0 },
      kick: { value: 0 }, level: { value: 0 }, bands: { value: new Float32Array(16) },
      c0: { value: new THREE.Color() }, c1: { value: new THREE.Color() }, c2: { value: new THREE.Color() } },
    vertexShader: FLATV,
    fragmentShader: `
      uniform float time, aspect, ang, zoom, warp, kick, level; uniform float bands[16]; uniform vec3 c0, c1, c2; varying vec2 vUv;
      ${RAMP}
      void main() {
        vec2 uv = vUv * 2. - 1.;
        uv.x *= aspect;
        uv *= zoom * (1. - kick * 0.12);
        uv += warp * vec2(sin(uv.y * 3. + time), cos(uv.x * 3. + time * 0.8)) * 0.15;
        vec2 p = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * uv * 4. + vec2(time * 0.3, time * 0.17);
        vec2 cell = floor(p), f = fract(p) - 0.5;
        float check = mod(cell.x + cell.y, 2.);
        float ring = abs(length(f) - 0.28 - bands[int(mod(cell.x * 3. + cell.y * 7., 16.))] * 0.16);
        float idx = check + step(ring, 0.06) * 2. + step(abs(f.x) + abs(f.y), 0.12);
        vec3 col = ramp(idx * 0.21 + time * 0.05 + cell.x * 0.03) * (0.55 + 0.45 * check + level * 0.3);
        gl_FragColor = vec4(col, 1.);
      }`,
    depthTest: false, depthWrite: false,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  quad.frustumCulled = false;
  scene.add(quad);
  let ang = 0, spin = 0;
  return {
    scene, camera: flat,
    resize(a) { mat.uniforms.aspect.value = a; },
    update(dt) {
      const u = mat.uniforms;
      u.time.value += dt * (0.5 + S.energy * 1.5) * S.speed;
      u.bands.value.set(S.bands);
      u.kick.value = S.kick; u.level.value = S.energy;
      u.c0.value.copy(pal(0)); u.c1.value.copy(pal(1)); u.c2.value.copy(pal(2));
      ang += dt * (spin + input.dragX * 0.5) * S.speed;
    },
    shots: [() => [0.3, 1, 0.1], () => [-0.8, 0.5, 0], () => [0.1, 2.2, 0.4], () => [1.2, 1.2, 0.2], (t) => [Math.sin(t * 0.3), 0.8 + Math.sin(t * 0.2) * 0.5, 0.6]],
    aim(v) { spin = v[0]; mat.uniforms.zoom.value = v[1] * (1 - input.y * 0.2); mat.uniforms.warp.value = v[2]; },
    kick(s) { ang += 0.08 * s; },
    impact() { ang += 1.2; },
    click() { ang += 0.5; },
  };
}

// MARK: Raster Bars: shaded colour bars swinging past and a four-sided ribbon twisting through
// the middle, over faint copper lines.
function makeRaster() {
  const scene = new THREE.Scene();
  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, aspect: { value: 1.33 }, spread: { value: 0.5 }, twist: { value: 0.5 }, sway: { value: 0 },
      kick: { value: 0 }, level: { value: 0 }, bands: { value: new Float32Array(16) },
      c0: { value: new THREE.Color() }, c1: { value: new THREE.Color() }, c2: { value: new THREE.Color() } },
    vertexShader: FLATV,
    fragmentShader: `
      uniform float time, aspect, spread, twist, sway, kick, level; uniform float bands[16]; uniform vec3 c0, c1, c2; varying vec2 vUv;
      void main() {
        float y = vUv.y;
        vec3 col = mix(c2 * 0.06, c2 * 0.22, y) + c0 * 0.05 * step(0.5, fract(y * 48. + time * 0.4));
        for (int i = 0; i < 8; i++) {
          float f = float(i);
          float cy = 0.5 + sin(time * (0.9 + f * 0.13) + f * 0.8) * (0.22 + spread * 0.2 + kick * 0.06);
          float d = abs(y - cy) / (0.03 + bands[i * 2] * 0.035);
          if (d < 1.) {
            vec3 bc = mod(f, 3.) < 1. ? c0 : mod(f, 3.) < 2. ? c1 : c2;
            col = bc * (1. - d * d) * 1.3 + vec3(pow(1. - d, 10.)) * 0.7;
          }
        }
        float x = (vUv.x - 0.5) * aspect - sin(y * 2. + time * 0.6) * sway;
        float a = time * 1.1 + sin(y * 3. + time * 0.7) * twist * 3. + bands[2] * 1.5, w = 0.15 + level * 0.05;
        for (int k = 0; k < 4; k++) {
          float x1 = sin(a + float(k) * 1.5708) * w, x2 = sin(a + float(k + 1) * 1.5708) * w;
          if (x2 > x1 && x >= x1 && x <= x2) {
            vec3 fc = k == 0 ? c0 : k == 1 ? c1 : k == 2 ? c2 : mix(c0, c1, 0.5);
            col = fc * (0.35 + 0.9 * (x2 - x1) / (w * 1.42)) * (1. + kick * 0.4);
          }
        }
        gl_FragColor = vec4(col, 1.);
      }`,
    depthTest: false, depthWrite: false,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  quad.frustumCulled = false;
  scene.add(quad);
  return {
    scene, camera: flat,
    resize(a) { mat.uniforms.aspect.value = a; },
    update(dt) {
      const u = mat.uniforms;
      u.time.value += dt * (0.7 + S.energy * 1.4) * S.speed;
      u.bands.value.set(S.bands);
      u.kick.value = S.kick; u.level.value = S.energy;
      u.c0.value.copy(pal(0)); u.c1.value.copy(pal(1)); u.c2.value.copy(pal(2));
    },
    shots: [() => [0.5, 0.5, 0], () => [1, 0.2, 0.4], () => [0.2, 1, 0.1], (t) => [0.7, 0.6 + Math.sin(t * 0.3) * 0.4, Math.sin(t * 0.2) * 0.6]],
    aim(v) { const u = mat.uniforms; u.spread.value = v[0]; u.twist.value = v[1]; u.sway.value = v[2] + input.x * 0.3; },
    click() { S.kick = 1; },
  };
}

// MARK: Scenes

const order = ["sea", "towers", "tunnel", "crystal", "field", "grid", "voxel", "roto", "raster"];
const names = { sea: "Polygon Sea", towers: "Signal Towers", tunnel: "Tunnel", crystal: "Crystal", field: "Dither Field",
  grid: "Light Grid", voxel: "Voxel Hills", roto: "Rotozoom", raster: "Raster Bars" };
const makers = { sea: makeSea, towers: makeTowers, tunnel: makeTunnel, crystal: makeCrystal, field: makeField,
  grid: makeGrid, voxel: makeVoxel, roto: makeRoto, raster: makeRaster };
const built = {};
let current = "sea", fade = 0, autoAt = 0;
const scene = () => built[current] || (built[current] = makers[current]());
function use(key, announce = true) {
  if (!makers[key]) return;
  const was = current;
  if (key !== current) fade = 0;
  current = key;
  const s = scene();
  if (key !== was) director.reset(s.shots?.length || 0);
  if (!settings.res && (s.maxLines || 0) !== (built[was]?.maxLines || 0) && rt) applyRes();
  s.resize?.(low.x / low.y);
  if (s.camera.isPerspectiveCamera) { s.camera.aspect = low.x / low.y; s.camera.updateProjectionMatrix(); }
  if (announce) tag(document.getElementById("name"), names[key], 2500);
}
function step(d) { use(order[(order.indexOf(current) + d + order.length) % order.length]); }
function choose(key) {
  settings.scene = key;
  post({ scene: key });
  if (key === "auto") tag(document.getElementById("name"), "Auto", 2500); else use(key);
}

const targets = {};
let shownSize = "";
function applyRes() {
  // Native: the screen's own pixels. Otherwise a whole number of them per pixel (1440 lines: 240 at 6, 480 at 3).
  const hd = !settings.res, H = (innerHeight || 3) * (devicePixelRatio || 1), want = settings.res >= 480 ? 480 : 240;
  const cap = built[current]?.maxLines || H;  // a heavy scene's limit, still a whole number of pixels
  const h = hd ? Math.round(H / Math.ceil(H / cap)) : Math.round(H / Math.max(1, Math.round(H / want))), w = Math.max(1, Math.round(h * (innerWidth || 4) / (innerHeight || 3)));
  low.set(w, h);
  // Targets kept per size, and the canvas only reset when the window changes: both cost a frame.
  const size = `${innerWidth}x${innerHeight}@${devicePixelRatio}`;
  if (size !== shownSize) {
    shownSize = size;
    renderer.setSize(innerWidth, innerHeight, false);
    for (const k in targets) { targets[k].dispose(); delete targets[k]; }
  }
  const key = `${w}x${h}${hd ? "n" : ""}`, f = hd ? THREE.LinearFilter : THREE.NearestFilter;
  rt = targets[key] ||= new THREE.WebGLRenderTarget(w, h, { minFilter: f, magFilter: f, samples: hd ? 4 : 0 });
  postMat.uniforms.levels.value = hd ? 255 : h > 300 ? 63 : 31;
  postMat.uniforms.soft.value = hd ? 2 : h > 300 ? 1 : 0;
  postMat.uniforms.dither.value = hd ? 0 : 1;
  shared.affine.value = hd ? 0 : 1;
  if (h > 300) shared.snap.value.set(w * 64, h * 64); else shared.snap.value.set(w / 2, h / 2);
  caption.resize();
  use(current, false);
}
addEventListener("resize", applyRes);

// The song's title, low-res in Exo 2, for a few seconds after it changes.
const caption = (() => {
  const canvas = document.createElement("canvas"), tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  const capScene = new THREE.Scene(), cam = new THREE.OrthographicCamera(0, 1, 1, 0, -1, 1);
  capScene.add(mesh);
  let until = 0, text = ["", ""];
  function draw() {
    const s = Math.max(9, Math.round(low.y / 15)), g = canvas.getContext("2d");
    canvas.width = Math.round(low.x * 0.8); canvas.height = Math.round(s * 2.6);
    g.clearRect(0, 0, canvas.width, canvas.height);
    g.textBaseline = "top";
    g.font = `600 ${s}px "Exo 2", sans-serif`;
    g.fillStyle = "#000"; g.fillText(text[0], 1, 1);
    g.fillStyle = "#fff"; g.fillText(text[0], 0, 0);
    g.font = `300 ${Math.round(s * 0.7)}px "Sora", sans-serif`;
    g.fillStyle = "rgba(255,255,255,0.75)"; g.fillText(text[1], 0, Math.round(s * 1.35));
    tex.magFilter = tex.minFilter = settings.res ? THREE.NearestFilter : THREE.LinearFilter;
    tex.needsUpdate = true;
    const m = Math.round(low.y / 20);
    mesh.scale.set(canvas.width, canvas.height, 1);
    mesh.position.set(m + canvas.width / 2, m + canvas.height / 2, 0);
    cam.right = low.x; cam.top = low.y; cam.updateProjectionMatrix();
  }
  return {
    show(title, artist) {
      text = [title || "", artist || ""];
      until = performance.now() + 7000;
      document.fonts.load('600 12px "Exo 2"').catch(() => {}).then(draw);
    },
    hide() { until = 0; },
    resize() { if (text[0]) draw(); },
    render() {
      const left = until - performance.now();
      if (!settings.caption || left <= 0 || !text[0]) return;
      mat.opacity = Math.min(1, left / 800, (7000 - left) / 500);
      renderer.autoClear = false;
      renderer.render(capScene, cam);
      renderer.autoClear = true;
    },
  };
})();

// MARK: Input

function tag(el, text, ms) {
  if (text) el.textContent = text;
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.style.opacity = 0), ms);
}
let idle;
function awake() {
  document.body.classList.remove("idle");
  clearTimeout(idle);
  idle = setTimeout(() => document.body.classList.add("idle"), 2500);
}
let down = null;
addEventListener("pointermove", (e) => {
  input.tx = e.clientX / innerWidth * 2 - 1;
  input.ty = e.clientY / innerHeight * 2 - 1;
  if (down) { input.dragX += e.movementX * 0.004; input.dragY = Math.max(-0.8, Math.min(0.8, input.dragY + e.movementY * 0.003)); down.moved += Math.abs(e.movementX) + Math.abs(e.movementY); }
  awake();
});
addEventListener("pointerdown", (e) => { down = { moved: 0 }; });
addEventListener("pointerup", (e) => {
  if (down && down.moved < 8) {
    S.kick = Math.max(S.kick, 0.8);
    scene().click?.(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2);
  }
  down = null;
});
addEventListener("wheel", (e) => { input.warp = Math.max(0.25, Math.min(4, input.warp * Math.exp(-e.deltaY * 0.002))); }, { passive: true });
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "9") choose(order[+k - 1]);
  else if (k === "0") choose("auto");
  else if (k === "arrowright") choose(order[(order.indexOf(current) + 1) % order.length]);
  else if (k === "arrowleft") choose(order[(order.indexOf(current) + order.length - 1) % order.length]);
  else if (k === " ") S.key = true;
  else if (k === "p") {
    settings.res = settings.res === 240 ? 480 : settings.res === 480 ? 0 : 240;
    applyRes();
    post({ res: settings.res });
    tag(document.getElementById("name"), settings.res ? settings.res + "p" : "Native", 1500);
  }
  else if (k === "t") { settings.caption = !settings.caption; post({ caption: settings.caption }); }
  else if (k === "f") meter.on = !meter.on;
  else if (k === "h") tag(document.getElementById("help"), null, 6000);
  else if (k === "escape") post({ close: true });
  else return;
  e.preventDefault();
});
addEventListener("keyup", (e) => { if (e.key === " ") S.key = false; });

// MARK: Frame

// Every scene built and drawn once offscreen, one a frame after opening, so the first switch to
// one doesn't stall on shader compiles.
const cold = order.slice();
function warm() {
  if (t < 1 || !cold.length) return;
  const key = cold.shift();
  if (built[key]) return;
  const s = built[key] = makers[key]();
  s.resize?.(low.x / low.y);
  if (s.camera.isPerspectiveCamera) { s.camera.aspect = low.x / low.y; s.camera.updateProjectionMatrix(); }
  renderer.setRenderTarget(rt);
  renderer.render(s.scene, s.camera);
}
// F: frames a second and the slowest frame of the last second.
const meter = { on: false, n: 0, worst: 0, at: 0, el: document.getElementById("meter"),
  frame(ms) {
    this.n++; this.worst = Math.max(this.worst, ms);
    const now = performance.now();
    if (now - this.at < 1000) return;
    if (this.on) { this.el.textContent = `${Math.round(this.n * 1000 / (now - this.at))} fps · slowest ${Math.round(this.worst)} ms · ${low.x}×${low.y}`; this.el.style.opacity = 1; }
    else this.el.style.opacity = 0;
    this.n = 0; this.worst = 0; this.at = now;
  } };

let last = performance.now(), t = 0;
function frame(now) {
  requestAnimationFrame(frame);
  meter.frame(now - last);
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  t += dt;
  for (let i = 0; i < 16; i++) { const g = S.target[i]; S.bands[i] += (g - S.bands[i]) * Math.min(1, dt * (g > S.bands[i] ? 30 : 7)); }
  // Packets come at 60 Hz with some jitter; easing in hides it on faster screens.
  for (let i = 0; i < 64; i++) S.wave[i] += (S.waveTarget[i] - S.wave[i]) * Math.min(1, dt * 30);
  const avg = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += S.bands[i]; return s / (b - a); };
  S.bass = avg(0, 4); S.mid = avg(4, 10); S.high = avg(10, 16);
  S.energy += (S.level - S.energy) * Math.min(1, dt * 4);
  S.kick *= Math.exp(-dt * 7);
  S.impact *= Math.exp(-dt * 3);
  S.note *= Math.exp(-dt * 0.8);
  const goal = S.note * (0.3 + 0.7 * Math.min(1, S.bass * 1.4));
  S.swell += (goal - S.swell) * Math.min(1, dt * (goal > S.swell ? 9 : 2.5));
  S.speed += (input.warp - S.speed) * Math.min(1, dt * 3);
  input.x += (input.tx - input.x) * Math.min(1, dt * 3);
  input.y += (input.ty - input.y) * Math.min(1, dt * 3);
  if (settings.scene === "auto" && (autoAt += dt) > 150) { autoAt = 0; step(1); }
  fade = Math.min(1, fade + dt * 1.6);

  warm();
  const s = scene();
  s.update(dt, t);
  if (s.shots) { const v = director.frame(s.shots, t, dt); s.aim ? s.aim(v) : aim(s.camera, v); }
  renderer.setRenderTarget(rt);
  renderer.render(s.scene, s.camera);
  caption.render();
  renderer.setRenderTarget(null);
  postMat.uniforms.t.value = rt.texture;
  postMat.uniforms.fade.value = fade;
  postMat.uniforms.flash.value = S.held || S.key ? 1 : S.impact * 0.7;
  postMat.uniforms.swell.value = S.swell;
  renderer.render(postScene, flat);
}

applyRes();
use(current, false);
tag(document.getElementById("help"), null, 7000);
awake();
requestAnimationFrame(frame);
post({ ready: true });
</script>
</body>
</html>
