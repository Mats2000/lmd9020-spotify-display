<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171d3a">
<link rel="apple-touch-icon" href="/icon.png">
<title>Show Control</title>
<style>
@font-face { font-family: "Exo 2"; font-weight: 600; src: url(/fonts/Exo2.0-SemiBold.otf); }
@font-face { font-family: "Sora"; font-weight: 400; src: url(/fonts/Sora-Regular.ttf); }
@font-face { font-family: "Sora"; font-weight: 300; src: url(/fonts/Sora-Light.ttf); }
:root {
  --ink: #171d3a; --panel: #1c2345; --line: rgba(201, 207, 238, .16);
  --text: #e6e9f6; --ink2: #9ca3c6; --peri: #94abf9;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--ink); color: var(--text); font: 300 15px/1.4 Sora, sans-serif; }
body { padding: env(safe-area-inset-top) 16px calc(84px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
h1 { font: 600 28px "Exo 2", sans-serif; margin: 28px 0 4px; }
h2 { font: 400 11px Sora, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); margin: 30px 0 12px; }
.sub { color: var(--ink2); font-size: 13px; margin: 0 0 8px; }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.card.held { opacity: .75; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.name { font: 400 15px Sora, sans-serif; }
.kind { color: var(--ink2); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 400 13px Sora, sans-serif; color: var(--ink2); background: none; border: 1.2px solid var(--line);
  border-radius: 999px; padding: 0 15px; height: 36px; }
.chip.on { color: var(--text); background: var(--panel); border-color: var(--peri); }
.list button { display: flex; width: 100%; justify-content: space-between; align-items: center; font: 400 14px Sora, sans-serif;
  color: var(--ink2); background: none; border: 0; border-radius: 12px; height: 42px; padding: 0 12px; text-align: left; }
.list button.on { color: var(--text); background: var(--panel); }
.switch { width: 46px; height: 28px; border-radius: 99px; border: 1.2px solid var(--line); background: none; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 7px; left: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink2); transition: left .15s; }
.switch.on { border-color: var(--peri); background: var(--panel); }
.switch.on::after { left: 25px; background: var(--peri); }
.strip { display: flex; gap: 3px; height: 14px; margin: 12px 0; }
.strip i { flex: 1; border-radius: 3px; background: #000; }
label.slider { display: block; margin: 16px 0 4px; }
label.slider span { display: flex; justify-content: space-between; color: var(--ink2); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
label.slider b { font-weight: 400; color: var(--text); letter-spacing: 0; font-size: 13px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: none; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -10px; border-radius: 50%;
  background: var(--ink); border: 1.6px solid var(--peri); }
select, input[type=text], input[type=password] { font: 400 14px Sora, sans-serif; color: var(--text); background: var(--ink); border: 1px solid var(--line);
  border-radius: 12px; height: 40px; padding: 0 12px; width: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 14px 0; }
.sw { position: relative; width: 40px; height: 40px; }
.sw input { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; padding: 0; background: none; -webkit-appearance: none; appearance: none; }
.sw input::-webkit-color-swatch-wrapper { padding: 0; }
.sw input::-webkit-color-swatch { border: 0; border-radius: 50%; }
.sw .x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--ink); color: var(--ink2); font-size: 12px; line-height: 17px; text-align: center; padding: 0; }
.add { width: 40px; height: 40px; border-radius: 50%; border: 1px dashed var(--line); background: none; color: var(--ink2); font-size: 20px; }
.btn { font: 400 13px Sora, sans-serif; color: var(--text); background: none; border: 1.2px solid var(--line); border-radius: 999px; height: 38px; padding: 0 16px; }
.btn.small { height: 32px; font-size: 12px; padding: 0 12px; }
.held-note { color: var(--ink2); font-size: 12px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--ink); border-top: 1px solid var(--line); }
nav[hidden] { display: none; }
.pilot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.pilot button { text-align: left; border: 1px solid var(--line); border-radius: 18px; background: none; color: var(--text); padding: 16px 14px; min-height: 92px; }
.pilot button.on { border-color: var(--peri); background: var(--panel); }
.pilot b { display: block; font: 600 20px "Exo 2", sans-serif; }
.pilot span { display: block; color: var(--ink2); font-size: 12px; margin-top: 4px; line-height: 1.3; }
.now { border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 16px; }
.now .look { font: 600 24px "Exo 2", sans-serif; }
.now .tier { color: var(--ink2); font-size: 13px; margin-top: 2px; }
.bar { height: 4px; border-radius: 4px; background: var(--line); margin: 14px 0 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--peri); border-radius: 4px; transition: width .4s; }
.parts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.parts dt { color: var(--ink2); }
.parts dd { margin: 0; }
.wide { width: 100%; height: 46px; font-size: 15px; margin-top: 12px; }
.quick { display: flex; gap: 10px; margin-top: 18px; }
.quick .row { flex: 1; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.macro-about { color: var(--ink2); font-size: 11.5px; margin: -2px 0 0; }
.strip-top { display: flex; gap: 18px; align-items: flex-end; margin: 14px 0 4px; }
.strip-top div { font: 600 20px "Exo 2", sans-serif; }
.strip-top small { display: block; font: 400 10px Sora, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }
.desk { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.key { height: 54px; border-radius: 14px; border: 1.2px solid var(--line); background: none; color: var(--text); font: 400 14px Sora, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
.key.lit { background: #ff00ff; border-color: #ff00ff; color: var(--ink); }
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pads button { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: none; color: var(--text); font: 400 13px Sora, sans-serif; }
nav button { flex: 1; max-width: 170px; height: 44px; font: 400 14px Sora, sans-serif; color: var(--ink2); background: none; border: 0; border-radius: 12px; }
nav button.on { color: var(--text); background: var(--panel); }
.gate { margin-top: 26vh; text-align: center; }
.gate input { text-align: center; max-width: 280px; margin: 18px auto 12px; display: block; }
.gate .btn { margin: 0 auto; }
.lights { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 2px; scrollbar-width: none; }
.lights::-webkit-scrollbar { display: none; }
.light { flex: none; width: 150px; text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: none; color: var(--text); font: 300 12px Sora, sans-serif; }
.light.on { border-color: var(--peri); background: var(--panel); }
.light .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.light .kind { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.light .strip { margin: 8px 0 0; height: 8px; }
.light .strip i { border-radius: 2px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; }
.dot.on { background: var(--peri); }
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden>
  <button data-tab="autopilot">Live</button><button data-tab="lights">Lights</button><button data-tab="scenes">Scenes</button><button data-tab="display">Display</button>
</nav>
<script>
"use strict";
const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let key = store.get("showKey"), tab = store.get("showTab") || "autopilot", picked = store.get("showLight");
if (!["autopilot", "lights", "scenes", "display"].includes(tab)) tab = "autopilot";
let state = null, shape = "", busyUntil = 0;
const app = document.getElementById("app"), nav = document.getElementById("nav");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const SOURCE = { own: "These colours", cover: "Cover", scheme: "Display colours" };

async function call(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Show-Key": key, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { key = ""; store.set("showKey", ""); gate(""); return null; }
  return r.ok ? r.json() : null;
}
async function act(body) { busyUntil = Date.now() + 600; const s = await call("/api/do", body); if (s) show(s); }
async function poll() {
  if (document.visibilityState === "visible" && key) {
    try { const s = await call("/api/state"); if (s && Date.now() > busyUntil) show(s); } catch (e) {}
  }
  setTimeout(poll, 700);
}

function gate(note) {
  nav.hidden = true; shape = "";
  app.innerHTML = `<form class="gate" id="gate"><h1>Show Control</h1><p class="sub">${esc(note || "Sign in with the password set on the Mac, under Scenes.")}</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button class="btn">Sign in</button></form>`;
  document.getElementById("gate").onsubmit = async e => {
    e.preventDefault();
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.key) { key = j.key; store.set("showKey", key); start(); }
    else gate(r.status === 429 ? "Too many tries. Wait a little, then try again." : r.status === 403 ? "Set a password on the Mac first, under Scenes." : "That password didn't work.");
  };
}
async function start() { const s = await call("/api/state"); if (s) { nav.hidden = false; show(s); } }

const strip = (cs, attr = "") => `<div class="strip"${attr}>${(cs.length ? cs : ["#000000"]).map(c => `<i style="background:${c}"></i>`).join("")}</div>`;
const data = a => `data-act='${esc(JSON.stringify(a))}'`;
const sw = (on, a) => `<button class="switch${on ? " on" : ""}" ${data(a)}></button>`;
const chip = (label, on, a) => `<button class="chip${on ? " on" : ""}" ${data(a)}>${esc(label)}</button>`;
const slider = (label, k, v, min, max, unit, a) =>
  `<label class="slider"><span>${label}<b>${v}${unit}</b></span><input type="range" min="${min}" max="${max}" value="${v}" data-key="${k}" data-unit="${unit}" data-base='${esc(JSON.stringify(a))}'></label>`;
const current = s => s.fixtures.find(f => f.id === picked) || s.fixtures[0];

function show(s) {
  state = s;
  const f = current(s), l = f && f.look;
  const k = [tab, s.fixtures.map(x => x.id + x.held + x.on + x.name + x.look.name + x.preset).join(), s.presets.map(p => p.id + p.name).join(),
    s.scenes.map(x => x.id).join(), f && [f.id, f.brightness, f.kick, f.bulb].join(), s.autopilot, s.autoLook, s.palette,
    (s.macros || []).map(m => m.value).join(), s.tilesOn, s.master, s.blackout, s.flash, s.freeze, l && JSON.stringify(l, Object.keys(l).sort()), s.style, s.scheme, s.lampsOn].join("|");
  for (const b of nav.querySelectorAll("button")) b.classList.toggle("on", b.dataset.tab === tab);
  if (k !== shape) { shape = k; render(s); return; }
  for (const x of s.fixtures) for (const el of document.querySelectorAll(`[data-live="${CSS.escape(x.id)}"]`)) el.outerHTML = strip(x.colours, ` data-live="${esc(x.id)}"`);
  const np = document.querySelector("[data-np]");
  if (np) np.textContent = s.title ? `${s.title} · ${s.artist}` : s.status;
  const bar = document.querySelector("[data-energy]");
  if (bar) bar.style.width = `${Math.min(100, Math.round((s.energy || 0) * 140))}%`;
  const bpm = document.querySelector("[data-bpm]"), moment = document.querySelector("[data-moment]");
  if (bpm) bpm.textContent = bpmText(s);
  if (moment) moment.innerHTML = momentText(s);
}

const bpmText = s => (s.playing && s.bpm ? String(s.bpm) : "–");
const momentText = s => (s.playing ? esc((s.autoTier || "").replace(/^./, c => c.toUpperCase())) : "Paused");

const PILOTS = [["off", "Off", "Everything as you set it"], ["club", "Club", "Follows the song's arc, hits on drops"],
  ["lounge", "Lounge", "Slow, evolving, never strobes"], ["rave", "Rave", "Maximal, a new look every 8 bars"]];
const PALETTES = [["cover", "Cover"], ["sentia", "Sentia"], ["ice", "Ice"], ["sunset", "Sunset"]];

// The control centre: the autopilot first, then the quick switches.
function autopilotTab(s) {
  let h = `<div class="strip-top"><div><small>BPM</small><span data-bpm>${bpmText(s)}</span></div><div><small>Moment</small><span data-moment>${momentText(s)}</span></div></div>`;
  h += `<div class="bar"><i data-energy style="width:${Math.min(100, Math.round((s.energy || 0) * 140))}%"></i></div>`;
  h += `<h2>Desk</h2>` + slider("Master", "value", s.master, 0, 100, "%", { action: "master" });
  h += `<div class="desk"><button class="key${s.blackout ? " lit" : ""}" ${data({ action: "blackout", on: !s.blackout })}>Blackout</button>
    <button class="key${s.flash ? " lit" : ""}" id="flashKey">Flash</button>
    <button class="key${s.freeze ? " lit" : ""}" ${s.autopilot === "off" ? "disabled style=\"opacity:.45\"" : ""} ${data({ action: "freeze", on: !s.freeze })}>${s.freeze ? "Frozen" : "Freeze"}</button></div>`;
  h += `<h2>Autopilot</h2><div class="pilot" style="margin-top:0">${PILOTS.map(([k, n, about]) => `<button class="${s.autopilot === k ? "on" : ""}" ${data({ action: "autopilot", style: k })}><b>${n}</b><span>${about}</span></button>`).join("")}</div>`;
  if (s.autopilot !== "off") {
    const p = s.autoParts || {};
    h += `<div class="now"><div class="look">${esc(s.autoLook || "Waiting for the music")}</div>
`;
    if (p.lamps) h += `<dl class="parts"><dt>Lamps</dt><dd>${esc(p.lamps)}</dd><dt>Bulb</dt><dd>${esc(p.bulb)}</dd><dt>Display</dt><dd>${esc(p.display)}</dd>${p.tiles ? `<dt>TILES</dt><dd>${esc(p.tiles)}</dd>` : ""}</dl>`;
    h += `<button class="btn wide" ${data({ action: "nextLook" })}>Next look</button></div>`;
    h += `<h2>Palette</h2><div class="chips">${PALETTES.map(([k, n]) => chip(n, s.palette === k, { action: "autopilot", palette: s.palette === k ? "" : k })).join("")}</div>`;
    h += `<h2>Macros</h2>`;
    (s.macros || []).forEach((m, i) => {
      h += slider(esc(m.name), "value", m.value, 0, 100, "", { action: "macro", index: i }) + `<p class="macro-about">${esc(m.about)}</p>`;
    });
  }
  if (s.scenes.length) h += `<h2>Scenes</h2><div class="pads">${s.scenes.map(sc => `<button ${data({ action: "sceneRecall", id: sc.id })}>${esc(sc.name)}</button>`).join("")}</div>`;
  h += `<div class="quick"><div class="row"><span class="grow">Lights</span>${sw(s.lampsOn, { action: "lamps", on: !s.lampsOn })}</div>`;
  if (s.tilesName) h += `<div class="row"><span class="grow">TILES</span>${sw(s.tilesOn, { action: "tiles", on: !s.tilesOn })}</div>`;
  return h + `</div>`;
}

function lightsTab(s) {
  let h = "";
  if (!s.fixtures.length) return h + `<p class="sub">Looking for lights…</p>`;
  h += `<div class="lights">${s.fixtures.map(x => `<button class="light${x.id === current(s).id ? " on" : ""}" data-pick="${esc(x.id)}">
    <div class="row"><span class="name grow">${esc(x.name)}</span><span class="dot${x.on && !x.held ? " on" : ""}"></span></div>
    <div class="kind">${esc(x.held ? "Alexa has it" : x.on ? x.look.name : "Off")}</div>${strip(x.colours, ` data-live="${esc(x.id)}"`)}</button>`).join("")}</div>`;
  const f = current(s), l = f.look, id = f.id, base = { action: "look", id }, strip_ = f.kind === "govee";
  h += `<div class="row" style="margin-top:24px"><div class="grow"><div class="name">${esc(f.name)}</div>
    <div class="kind">${f.kind === "govee" ? `Govee · ${f.segments} segments` : "Matter light"}</div></div>${f.held ? "" : sw(f.on, { action: "fixture", id, on: !f.on })}</div>`;
  if (f.held) {
    return h + `<div class="row" style="margin-top:14px"><span class="grow held-note">Alexa has it. The show leaves it alone.</span><button class="btn small" ${data({ action: "take", id })}>Take back</button></div>`;
  }
  if (!strip_) h += `<h2>Style</h2><div class="chips">${[["strobe", "Strobe"], ["pulse", "Pulse"], ["wash", "Wash"]].map(([k, n]) => chip(n, f.bulb === k, { action: "fixture", id, bulb: k })).join("")}</div>`;
  h += slider("Brightness", "brightness", f.brightness, 0, 100, "%", { action: "fixture", id });
  if (strip_ || f.bulb !== "wash") h += slider("Kick", "kick", f.kick, 0, 150, "%", { action: "fixture", id });
  if (strip_) h += `<h2>Movement</h2><div class="chips">${s.movements.map(m => chip(cap(m), m === l.movement, { ...base, movement: m })).join("")}</div>`;
  h += `<h2>Colours</h2><div class="chips">${s.sources.map(m => chip(SOURCE[m], m === l.source, { ...base, source: m })).join("")}</div>`;
  {
    h += `<div class="swatches"${l.source === "own" ? "" : ' style="opacity:.55"'}>${l.colours.map((c, i) => `<div class="sw"><input type="color" value="${c}" data-colour="${i}">${l.colours.length > 1 ? `<button class="x" data-remove="${i}">×</button>` : ""}</div>`).join("")}
      ${l.colours.length < 6 ? `<button class="add" id="addColour">+</button>` : ""}</div>`;
  }
  h += `<div class="chips" style="margin-top:12px">${chip("In order", !l.random, { ...base, random: false })}${chip("Random", l.random, { ...base, random: true })}</div>`;
  h += `<div class="chips" style="margin-top:8px">${chip("With the beat", !l.bySong, { ...base, bySong: false })}${chip("With the song", l.bySong, { ...base, bySong: true })}</div>`;
  if (strip_) {
    h += slider("Spots from", "spotsLow", l.spotsLow, 1, 8, "", base) + slider("Spots to", "spotsHigh", l.spotsHigh, 1, 8, "", base);
    h += slider("Size from", "sizeLow", l.sizeLow, 1, 10, "", base) + slider("Size to", "sizeHigh", l.sizeHigh, 1, 10, "", base);
  }
  h += slider(strip_ ? "Speed" : "Colour changes", "speed", l.speed, 1, 5, "", base);
  h += slider("Rhythm quiet", "rhythmLow", l.rhythmLow, 0, 100, "%", base) + slider("Rhythm on the beat", "rhythmHigh", l.rhythmHigh, 0, 100, "%", base);
  if (strip_) h += `<h2>Direction</h2><div class="chips">${s.directions.map(d => chip(cap(d), d === l.direction, { ...base, direction: d })).join("")}</div>`;
  h += `<h2>Presets</h2><div class="chips">${s.presets.map(p => chip(p.name, p.id === f.preset, { action: "presetLoad", id, preset: p.id })).join("")}</div>`;
  h += `<input type="text" id="lookName" value="${esc(l.name)}" style="margin-top:14px">`;
  h += `<div class="chips" style="margin-top:12px">${chip("Save as a preset", false, { action: "presetSave", id })}${chip("Same on every light", false, { action: "sameOnAll", id })}`;
  if (f.preset && s.presets.length > 1) h += chip("Delete this preset", false, { action: "presetDelete", preset: f.preset });
  h += `</div><div class="row" style="margin-top:22px"><span class="grow"></span><button class="btn small" ${data({ action: "hold", id })}>Hand to Alexa</button></div>`;
  return h;
}

function render(s) {
  const np = `<p class="sub" data-np>${esc(s.title ? `${s.title} · ${s.artist}` : s.status)}</p>`;
  let h;
  if (tab === "autopilot") {
    h = `<h1>Live</h1>${np}` + autopilotTab(s);
  } else if (tab === "lights") {
    h = `<h1>Lights</h1>${np}<div class="row" style="margin:14px 0 18px"><span class="grow">Lights follow the music</span>${sw(s.lampsOn, { action: "lamps", on: !s.lampsOn })}</div>` + lightsTab(s);
  } else if (tab === "scenes") {
    h = `<h1>Scenes</h1>${np}<div class="list">`;
    if (!s.scenes.length) h += `<p class="sub">None yet. Set the lights up, then save the room here.</p>`;
    for (const sc of s.scenes) h += `<div class="row"><button class="grow" ${data({ action: "sceneRecall", id: sc.id })}>${esc(sc.name)}</button>
      <button class="btn small" style="width:auto" ${data({ action: "sceneDelete", id: sc.id })}>Delete</button></div>`;
    h += `</div><div class="row" style="margin-top:12px"><input type="text" id="sceneName" placeholder="Scene name" class="grow"><button class="btn" id="sceneSave">Save scene</button></div>`;
  } else {
    h = `<h1>Display</h1>${np}`;
    if (s.autopilot !== "off") h += `<p class="sub">The autopilot is choosing the visualizer; these are yours for when it's off.</p>`;
    h += `<h2>Visualizer</h2><div class="list">${s.styles.map(x => `<button class="${x === s.style ? "on" : ""}" ${data({ action: "display", style: x })}>${esc(x)}</button>`).join("")}</div>`;
    h += `<h2>Colours</h2><div class="list">${s.schemes.map(x => `<button class="${x === s.scheme ? "on" : ""}" ${data({ action: "display", scheme: x })}>${esc(x)}</button>`).join("")}</div>`;
  }
  app.innerHTML = h;
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b) return act(JSON.parse(b.dataset.act));
  const p = e.target.closest("[data-pick]");
  if (p) { picked = p.dataset.pick; store.set("showLight", picked); shape = ""; return show(state); }
  const f = state && current(state);
  if (e.target.id === "addColour") return act({ action: "look", id: f.id, source: "own", colours: [...f.look.colours, f.look.colours[f.look.colours.length - 1] || "#ffffff"] });
  if (e.target.dataset.remove !== undefined) return act({ action: "look", id: f.id, source: "own", colours: f.look.colours.filter((_, i) => i !== +e.target.dataset.remove) });
  if (e.target.id === "sceneSave") return act({ action: "sceneSave", name: document.getElementById("sceneName").value });
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.key) { t.previousElementSibling.querySelector("b").textContent = t.value + t.dataset.unit; busyUntil = Date.now() + 800; }
});
app.addEventListener("change", e => {
  const t = e.target, f = state && current(state);
  if (t.dataset.key) return act({ ...JSON.parse(t.dataset.base), [t.dataset.key]: +t.value });
  if (t.dataset.colour !== undefined) { const cs = f.look.colours.slice(); cs[+t.dataset.colour] = t.value; return act({ action: "look", id: f.id, source: "own", colours: cs }); }
  if (t.id === "lookName" && t.value.trim()) return act({ action: "look", id: f.id, name: t.value.trim() });
});
// Flash is held: on while the finger's down (the Mac lets go by itself after 5 s).
let flashing = false;
const flashHeld = on => {
  if (on === flashing) return;
  flashing = on;
  const k = document.getElementById("flashKey");
  if (k) k.classList.toggle("lit", on);
  act({ action: "flash", on });
};
app.addEventListener("pointerdown", e => { if (e.target.id === "flashKey") { e.preventDefault(); flashHeld(true); } });
for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, () => flashHeld(false));

nav.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  tab = b.dataset.tab;
  store.set("showTab", tab);
  shape = "";
  if (state) show(state);
  window.scrollTo(0, 0);
});
if (key) start(); else gate("");
poll();
</script>
</body>
</html>
