; LMD-9020 Spotify display. Flash: pio run -t upload

[env:esp32dev]
; Arduino-ESP32 2.0.17: the composite video library needs ESP-IDF 4.x.
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
; No OTA, so give the firmware the whole flash.
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; -O2: the per-pixel loops run much faster than with the default -Os.
build_unflags = -Os
build_flags = -O2
lib_deps =
    roger-random/ESP_8_BIT Color Composite Video Library @ 1.3.2
    bblanchon/ArduinoJson @ ^7.4.2
    ; Only for the BearSSL engine it bundles; see src/https.h.
    openslab-osu/SSLClient @ ^1.6.11
