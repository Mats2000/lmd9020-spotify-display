; LMD-9020 Spotify display. Flash over USB: pio run -t upload; over Wi-Fi: tools/ota.sh

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.0.17: the composite video library needs ESP-IDF 4.x.
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
; Two app slots, for updates over Wi-Fi (the firmware is ~1.1 MB of each 1.9 MB). The NVS
; (the saved Spotify login) sits where it did with huge_app.csv.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; -O2: the per-pixel loops run much faster than with the default -Os.
build_unflags = -Os
build_flags = -O2
; The composite video library is vendored (and modified) in lib/ESP_8_BIT_composite.
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    ; Only for the BearSSL engine it bundles; see src/https.h.
    openslab-osu/SSLClient @ ^1.6.11

; Over Wi-Fi (tools/ota.sh finds the board and supplies the password).
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags =
    --auth=${sysenv.LMD_OTA_PASSWORD}
